<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keyboard · hairline</title>
<style>
:root{--bg:#f4f4f2;--fg:#1d1d20;--muted:#76767e;--line:#d9d9dc;--hl-plate:#fbfbf9;--hl-hi:#0e0f12;--hl-edge:#3a3b42;--hl-mid:#8b8c95;--hl-lo:#d7d8dc;--hl-stroke:0.9;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0b0e;--fg:#ececef;--muted:#8a8a93;--line:#26262b;--hl-plate:#101014;--hl-hi:#fafafa;--hl-edge:#a1a1aa;--hl-mid:#52525b;--hl-lo:#27272a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0e;--fg:#ececef;--muted:#8a8a93;--line:#26262b;--hl-plate:#101014;--hl-hi:#fafafa;--hl-edge:#a1a1aa;--hl-mid:#52525b;--hl-lo:#27272a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.4 ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:760px;display:flex;flex-direction:column;gap:14px}
.fig{width:100%;aspect-ratio:5/4;background:var(--hl-plate);border:1px solid var(--line);border-radius:12px;overflow:hidden}.fig svg{width:100%;height:100%;display:block;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;color:var(--muted)}.bar label{display:flex;gap:8px;align-items:center;flex:1;min-width:200px}.bar input{flex:1}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}button:hover{border-color:var(--muted)}
h1{font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
<h1>keyboard</h1>
<div class="fig"><svg id="figure" role="img" aria-label="keyboard, an interactive line figure"></svg></div>
<div class="bar"><label>Intensity <input type="range" id="intensity" min="0" max="1" step="0.01" value="0.60"></label><button id="theme">Theme: auto</button><button id="play">Play</button></div>
</main>
<script>

function hairlineMount(svg, fig, opts){
  opts = opts || {};
  var NS = 'http://www.w3.org/2000/svg', C = 0.8660254, S = 40;

    hist: [], tour: null, sims: [], els: [], rest: [], rank: [], plate: null, span: [0, 1], vb: [0, 0, 1, 1],

  }

    f.right.setAttribute('points', pts([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, t], [x + w, y, t]]));

      'L' + (t[0] + rx).toFixed(1) + ' ' + t[1].toFixed(1) + 'L' + (b[0] + rx).toFixed(1) + ' ' + b[1].toFixed(1) +
      'A' + rx.toFixed(1) + ' ' + ry.toFixed(1) + ' 0 0 1 ' + (b[0] - rx).toFixed(1) + ' ' + b[1].toFixed(1) + 'Z');

  }

    st.fig.parts.forEach(function(p){ corners(shape(p, 0)).concat(corners(shape(p, amax))).forEach(function(c){ xs.push(c[0]); ys.push(c[1]); }); });
    if (st.plate) corners(st.plate).forEach(function(c){ xs.push(c[0]); ys.push(c[1]); });
    if (!xs.length){ xs = [-100, 100]; ys = [-80, 80]; }
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var w = x1 - x0, h = y1 - y0, pad = Math.max(30, Math.max(w, h) * 0.08);
    w += pad * 2; h += pad * 2; var ar = 5 / 4;
    if (w / h < ar){ var nw = h * ar; x0 -= (nw - w) / 2; w = nw; } else { var nh = w / ar; y0 -= (nh - h) / 2; h = nh; }

    svg.setAttribute('viewBox', st.vb.map(function(v){ return v.toFixed(1); }).join(' '));
  }
  function build(keepView){
    svg.textContent = '';
    st.dirty = true; st.zord = []; st.drawn = [];
    svg.classList.add('hl-svg');
    var css = mk('style', svg);
    css.textContent = '.hl-svg polygon,.hl-svg path,.hl-svg ellipse{fill:var(--hl-plate);stroke:var(--hl-mid);stroke-width:var(--hl-stroke,0.9);vector-effect:non-scaling-stroke;stroke-linejoin:round}' +

      var g = mk('g', layer); g.setAttribute('data-i', i);
      var f = p.kind === 'cyl' ? {body: mk('path', g), cap: mk('ellipse', g)} : boxEls(g);

    st.rest = st.fig.parts.map(function(p){ return P(p.x + p.w / 2, p.y + p.d / 2, p.z + p.h); });

    var moving = st.rest.map(function(_, i){ return i; }).filter(function(i){ return !st.fig.parts[i].still; });

    if (!keepView || !svg.getAttribute('viewBox')) fit();

  function dist(i, p){
    if (!p || st.fig.parts[i].still) return null;
    var pick = st.fig.motion.pick, n = st.order.length;
    if (pick === 'pointer') return Math.hypot(p.x - st.rest[i][0], p.y - st.rest[i][1]) / S;
    var v = pick === 'across' ? p.x : p.y, lo = st.span[0], hi = st.span[1];
    var f = n < 2 || hi - lo < 1 ? 0 : (v - lo) / (hi - lo) * (n - 1);

  }
  function fall(d){
    if (d == null) return 0;
    var core = 0.4, r = Math.max(0.05, st.fig.motion.reach);
    if (d <= core) return 1;
    var v = Math.max(0, 1 - (d - core) / r); return v * v;
  }
  function sample(t){ for (var k = st.hist.length - 1; k >= 0; k--){ if (st.hist[k].t <= t) return st.hist[k].p; } return st.hist.length ? st.hist[0].p : null; }

    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var m = svg.getScreenCTM(); if (!m) return null; var q = pt.matrixTransform(m.inverse()); return {x: q.x, y: q.y};
  }
  svg.addEventListener('pointermove', function(e){ if (!st.tour) st.ptr = toVB(e); });

  function hex(g){ return [g.x - g.y - g.d, g.x + g.w - g.y, g.z - g.y - g.d, g.z + g.h - g.y, g.z - g.x - g.w, g.z + g.h - g.x]; }

    update: function(f, keepView){ st.fig = f; build(keepView); },
    setMode: function(mo){ st.mode = mo; st.tour = null; build(); },
    setIntensity: function(v){ st.I = v; st.dirty = true; },
    setSelected: function(i){ st.sel = i; st.dirty = true; },

    touring: function(){ return !!st.tour; },

}
var fig = hairlineMount(document.getElementById("figure"), FIGURE, {intensity: 0.60, onTourEnd: function(){ document.getElementById("play").textContent = "Play"; }});
document.getElementById("intensity").addEventListener("input", function(e){ fig.setIntensity(parseFloat(e.target.value)); });
var themes = ["auto", "light", "dark"], ti = 0;
document.getElementById("theme").addEventListener("click", function(e){ ti = (ti + 1) % 3; if (themes[ti] === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", themes[ti]); e.target.textContent = "Theme: " + themes[ti]; });

</script>
